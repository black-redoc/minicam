name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a
      # moved or compromised tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app main.py

      - name: Pytest
        run: uv run pytest

  raspberry-pi-os:
    name: Raspberry Pi OS arm64 (tests)
    # The device's userland, not its hardware or kernel (no 16 KB pages, no
    # cameras, no accelerator): Debian trixie arm64 plus Raspberry Pi's apt
    # repository, see .github/scripts/raspberry-pi-os-setup.sh. Tests run as
    # the unprivileged `pi` user, like the systemd unit on the device.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Raspberry Pi OS
        run: sh .github/scripts/raspberry-pi-os-setup.sh

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: |
          chown -R pi:pi .
          runuser -u pi -- env HOME=/home/pi UV_CACHE_DIR=/home/pi/.cache/uv uv sync --locked

      - name: Pytest
        run: runuser -u pi -- env HOME=/home/pi UV_CACHE_DIR=/home/pi/.cache/uv uv run pytest

  js:
    name: JavaScript (lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # Dev tooling only; no package needs an install script.
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: TypeScript (JSDoc check)
        run: npm run typecheck
