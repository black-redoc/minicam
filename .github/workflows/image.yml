name: Image

# A vX.Y.Z tag builds the ready-to-flash Raspberry Pi OS image (64-bit Lite,
# trixie, Pi 4 and Pi 5) with minicam preinstalled and attaches it to that
# tag's GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  # pi-gen's arm64 branch, pinned by commit like the actions below.
  PI_GEN_COMMIT: c851f00178c64b87a86c06c2be216bd89d62e55b
  UV_VERSION: "0.12.21"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build image
    needs: ci
    # Native arm64: pi-gen runs the image's binaries without QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        run: sh .github/scripts/check-version.sh "$GITHUB_REF_NAME"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pi-gen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libcap2-bin grep rsync xz-utils curl xxd file \
            git kmod bc gpg pigz arch-test

      - name: Fetch pi-gen
        run: |
          git init -q pi-gen
          git -C pi-gen fetch -q --depth 1 https://github.com/RPi-Distro/pi-gen.git "$PI_GEN_COMMIT"
          git -C pi-gen checkout -q FETCH_HEAD
          # Only the minicam stage is exported, not plain Raspberry Pi OS Lite.
          touch pi-gen/stage2/SKIP_IMAGES

      - name: Stage minicam
        run: |
          files=image/stage-minicam/00-minicam/files
          mkdir -p "$files"
          git archive --format=tar -o "$files/minicam.tar" HEAD
          install -m 755 "$(command -v uv)" "$files/uv"

      - name: Build
        working-directory: pi-gen
        # GIT_HASH: git refuses to read the runner-owned checkout as root.
        run: |
          sudo GIT_HASH="$PI_GEN_COMMIT" ./build.sh -c "$GITHUB_WORKSPACE/image/config"
          # Each stage keeps a full root filesystem; free the disk for the checks.
          sudo rm -rf work

      - name: Check image
        run: |
          name=minicam-$GITHUB_REF_NAME-raspios-trixie-arm64
          xz --decompress --keep --stdout "pi-gen/deploy/$name.img.xz" > "$RUNNER_TEMP/$name.img"
          sudo sh .github/scripts/check-image.sh "$RUNNER_TEMP/$name.img"

      - name: Checksum
        working-directory: pi-gen/deploy
        run: |
          name=minicam-$GITHUB_REF_NAME-raspios-trixie-arm64.img.xz
          sha256sum "$name" > "$name.sha256"
          sha256sum --check "$name.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: |
            pi-gen/deploy/minicam-${{ github.ref_name }}-raspios-trixie-arm64.img.xz
            pi-gen/deploy/minicam-${{ github.ref_name }}-raspios-trixie-arm64.img.xz.sha256
          # Already xz-compressed.
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish to the Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that can write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Verify artifact
        run: sha256sum --check "minicam-$GITHUB_REF_NAME-raspios-trixie-arm64.img.xz.sha256"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name=minicam-$GITHUB_REF_NAME-raspios-trixie-arm64.img.xz
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "minicam $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" --clobber
