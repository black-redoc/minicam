# Drop-in for deploy/minicam.service in the Raspberry Pi OS image: the same
# sandbox, with the image's paths. Installed as
# /etc/systemd/system/minicam.service.d/image.conf.
[Unit]
# The device's .env is created on first boot.
Requires=minicam-firstboot.service
After=minicam-firstboot.service

[Service]
User=minicam
Group=minicam
WorkingDirectory=/opt/minicam
# An empty assignment clears the value from the main unit.
EnvironmentFile=
EnvironmentFile=/opt/minicam/.env
# .venv is built when the image is made: start it directly, no `uv run`.
ExecStart=
ExecStart=/opt/minicam/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8080 --ws-per-message-deflate false
# Runtime state (config.toml, minicam.db, app/data/) lives in /opt/minicam.
ReadWritePaths=
ReadWritePaths=/opt/minicam
ProtectHome=true
