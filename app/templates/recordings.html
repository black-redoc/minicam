{% extends "base.html" %}

{% block title %}minicam — Recordings{% endblock %}

{% block content %}

<header class="sticky top-0 z-20 flex items-center justify-between h-14 px-4 md:px-6
               bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-sky-400 dot-glow"></span>
        <span class="text-sky-400 font-bold tracking-tight text-base">minicam</span>
        <span class="text-slate-600">/</span>
        <span class="text-slate-300 text-sm">Recordings</span>
    </div>
    <a href="/"
       class="text-xs font-medium text-slate-400 hover:text-slate-100 transition-colors">
        &larr; Dashboard
    </a>
</header>

<main class="p-4 md:p-6 max-w-4xl mx-auto w-full flex flex-col gap-6">

    <!-- Player (shown once a clip is selected) -->
    <section id="recording-player" class="hidden card flex flex-col gap-3" aria-live="polite">
        <div class="video-container">
            <video id="recording-video" controls playsinline preload="metadata"
                   class="w-full h-full object-contain bg-black"></video>
        </div>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex flex-col gap-1 min-w-0">
                <p id="recording-title" class="text-sm font-semibold text-slate-100 truncate"></p>
                <p id="recording-meta" class="text-xs text-slate-400"></p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <a id="recording-download"
                   href="#"
                   class="flex items-center gap-1.5 text-xs font-medium px-3 h-8 rounded-lg
                          bg-slate-700 hover:bg-slate-600 text-slate-100 transition-colors
                          focus:outline-none focus:ring-2 focus:ring-sky-500">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" class="w-4 h-4 pointer-events-none">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <path d="M7 10l5 5 5-5"/>
                        <path d="M12 15V3"/>
                    </svg>
                    Download
                </a>
                {% if is_admin %}
                <button id="recording-delete"
                        type="button"
                        class="flex items-center gap-1.5 text-xs font-medium px-3 h-8 rounded-lg
                               text-red-400 hover:text-red-300 hover:bg-slate-700/60 transition-colors
                               focus:outline-none focus:ring-2 focus:ring-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" class="w-4 h-4 pointer-events-none">
                        <path d="M3 6h18"/>
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    </svg>
                    Delete
                </button>
                {% endif %}
            </div>
        </div>
    </section>

    <!-- Clip list -->
    <section class="flex flex-col gap-3">
        <div class="flex items-center justify-between gap-3 px-1">
            <h2 class="text-xs text-slate-500 uppercase tracking-widest font-semibold">
                Event recordings
            </h2>
            <label class="flex items-center gap-2 text-xs text-slate-400">
                <span>Camera</span>
                <select id="recordings-camera-filter"
                        class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5
                               text-xs text-slate-100 focus:outline-none focus:ring-2
                               focus:ring-sky-500 max-w-[10rem]">
                    <option value="">All cameras</option>
                    {% for name in camera_names %}
                    <option value="{{ name }}">{{ name }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>

        <p id="recordings-error" class="hidden text-xs text-red-400 px-1" role="alert"></p>
        <div id="recordings-list" class="flex flex-col gap-4">
            <p class="text-sm text-slate-500 px-1">Loading…</p>
        </div>
        <button id="recordings-more"
                type="button"
                class="hidden self-center text-xs font-medium px-4 h-8 rounded-lg
                       bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors
                       disabled:opacity-50 disabled:cursor-not-allowed
                       focus:outline-none focus:ring-2 focus:ring-sky-500">
            Load more
        </button>
    </section>

</main>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
<script src="{{ url_for('static', path='js/confirm-dialog.js') }}"></script>
<script src="{{ url_for('static', path='js/recordings.js') }}"></script>
{% endblock %}
