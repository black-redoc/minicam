{% extends "base.html" %}

{% block title %}minicam — AI Detection{% endblock %}

{% block content %}

<header class="sticky top-0 z-20 flex items-center justify-between h-14 px-4 md:px-6
               bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-sky-400 dot-glow"></span>
        <span class="text-sky-400 font-bold tracking-tight text-base">minicam</span>
        <span class="text-slate-600">/</span>
        <span class="text-slate-300 text-sm">AI Detection</span>
    </div>
    <a href="/"
       class="text-xs font-medium text-slate-400 hover:text-slate-100 transition-colors">
        &larr; Dashboard
    </a>
</header>

<main class="p-4 md:p-6 max-w-3xl mx-auto w-full flex flex-col gap-6">

    <!-- AI Detection -->
    <section class="card flex flex-col gap-4">
        <h2 class="text-xs text-slate-500 uppercase tracking-widest font-semibold">
            AI Detection
        </h2>
        <form id="detection-settings-form" class="flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-end">
                <div class="flex flex-col gap-1 flex-1 w-full">
                    <label for="detection-backend" class="text-xs text-slate-400">Backend</label>
                    <select id="detection-backend" name="backend"
                            class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                                   text-sm text-slate-100 focus:outline-none focus:ring-2
                                   focus:ring-sky-500">
                        <option value="none">None</option>
                        <option value="onnx">ONNX (CPU)</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1 flex-1 w-full">
                    <label for="detection-confidence" class="text-xs text-slate-400">
                        Confidence threshold
                    </label>
                    <input id="detection-confidence" name="confidence_threshold" type="number"
                           step="0.05" min="0" max="1" required
                           class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                                  text-sm text-slate-100 focus:outline-none focus:ring-2
                                  focus:ring-sky-500">
                </div>
                <div class="flex flex-col gap-1 flex-1 w-full">
                    <label for="detection-fps" class="text-xs text-slate-400">Inference FPS</label>
                    <input id="detection-fps" name="inference_fps" type="number"
                           step="0.5" min="0.1" required
                           class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                                  text-sm text-slate-100 focus:outline-none focus:ring-2
                                  focus:ring-sky-500">
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label for="detection-model-path" class="text-xs text-slate-400">Model path</label>
                <input id="detection-model-path" name="model_path" type="text"
                       placeholder="/absolute/path/to/model.onnx"
                       class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                              text-sm text-slate-100 focus:outline-none focus:ring-2
                              focus:ring-sky-500">
            </div>

            <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-end">
                <div class="flex flex-col gap-1 flex-1 w-full">
                    <label for="detection-model-file" class="text-xs text-slate-400">
                        Upload .onnx model
                    </label>
                    <input id="detection-model-file" type="file" accept=".onnx"
                           class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                                  text-sm text-slate-100 focus:outline-none focus:ring-2
                                  focus:ring-sky-500 file:mr-3 file:py-1 file:px-2 file:rounded-md
                                  file:border-0 file:bg-slate-700 file:text-slate-100
                                  file:text-xs">
                </div>
                <button type="button" id="detection-upload-btn"
                        class="bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold
                               text-sm rounded-lg px-4 h-9 shrink-0 transition-colors
                               disabled:opacity-50 disabled:cursor-not-allowed">
                    Upload model
                </button>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-end">
                <div class="flex flex-col gap-1 flex-1 w-full">
                    <label for="detection-model-url" class="text-xs text-slate-400">
                        Or fetch from URL
                    </label>
                    <input id="detection-model-url" type="url"
                           placeholder="https://.../yolov8n-cpu.onnx"
                           class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                                  text-sm text-slate-100 focus:outline-none focus:ring-2
                                  focus:ring-sky-500">
                </div>
                <button type="button" id="detection-fetch-btn"
                        class="bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold
                               text-sm rounded-lg px-4 h-9 shrink-0 transition-colors
                               disabled:opacity-50 disabled:cursor-not-allowed">
                    Fetch from URL
                </button>
            </div>

            <p class="text-xs text-slate-500">
                1. Upload a .onnx model file, or fetch one from a URL. 2. Set it as the active backend and save.
            </p>

            <div class="flex items-center gap-3">
                <button type="submit" id="detection-save-btn"
                        class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold
                               text-sm rounded-lg px-4 h-9 shrink-0 transition-colors
                               disabled:opacity-50 disabled:cursor-not-allowed">
                    Save
                </button>
                <p id="detection-settings-success" class="hidden text-xs text-emerald-400"></p>
            </div>
            <p id="detection-settings-error" class="hidden text-xs text-red-400" role="alert"></p>
        </form>
    </section>

</main>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
<script src="{{ url_for('static', path='js/ai-detection.js') }}"></script>
{% endblock %}
