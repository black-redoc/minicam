{% extends "base.html" %}

{% block title %}minicam — Sign in{% endblock %}

{% block content %}

<main class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-sm flex flex-col gap-6">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-sky-400 dot-glow"></span>
            <span class="text-sky-400 font-bold tracking-tight text-base">minicam</span>
        </div>

        <form id="login-form" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1">
                <label for="email" class="text-xs text-slate-400">Email</label>
                <input id="email" name="email" type="email" required autocomplete="username"
                       class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                              text-sm text-slate-100 focus:outline-none focus:ring-2
                              focus:ring-sky-500">
            </div>

            <div class="flex flex-col gap-1">
                <label for="password" class="text-xs text-slate-400">Password</label>
                <input id="password" name="password" type="password" required
                       autocomplete="current-password"
                       class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2
                              text-sm text-slate-100 focus:outline-none focus:ring-2
                              focus:ring-sky-500">
            </div>

            <p id="login-error" class="hidden text-xs text-red-400" role="alert"></p>

            <button type="submit"
                    class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold
                           text-sm rounded-lg py-2 transition-colors">
                Sign in
            </button>
        </form>
    </div>
</main>

{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const errorEl = document.getElementById('login-error');
        errorEl.classList.add('hidden');

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        });

        if (res.ok) {
            window.location.href = '/';
            return;
        }

        errorEl.textContent = 'Invalid email or password.';
        errorEl.classList.remove('hidden');
    });
</script>
{% endblock %}
