{% extends "base.html" %}

{% block title %}minicam — Dashboard{% endblock %}

{% block content %}

<!-- ═══════════════════════════════════════════════════════════
     Top Navigation Bar
     ═══════════════════════════════════════════════════════════ -->
<header class="sticky top-0 z-20 flex items-center justify-between h-14 px-4 md:px-6
               bg-slate-900/90 backdrop-blur border-b border-slate-800">

    <div class="flex items-center gap-2">
        <!-- Indicator dot -->
        <span class="w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_6px_#38bdf8]"></span>
        <span class="text-sky-400 font-bold tracking-tight text-base">minicam</span>
    </div>

    <!-- Camera selector — populated by JS; hidden when only one camera is present -->
    <div id="camera-selector" class="flex items-center gap-1"></div>

    <div class="flex items-center gap-3">
        <span id="fps-display"
              class="hidden sm:inline text-xs text-slate-400 font-mono tabular-nums">
            -- FPS
        </span>
        <span id="status-badge" class="badge badge--connecting">
            <span data-label>Connecting…</span>
        </span>

        <!-- Docs link -->
        <a href="/doc/"
           aria-label="Open documentation"
           class="flex items-center gap-1.5 px-2 h-8 rounded-lg
                  text-slate-400 hover:text-slate-100 hover:bg-slate-800
                  transition-colors focus:outline-none focus:ring-2
                  focus:ring-sky-500 focus:ring-offset-1 focus:ring-offset-slate-900">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" class="w-4 h-4 pointer-events-none shrink-0">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="hidden sm:inline text-xs font-medium">Docs</span>
        </a>

        <button id="config-btn"
                type="button"
                aria-label="Open camera settings"
                class="flex items-center justify-center w-8 h-8 rounded-lg
                       text-slate-400 hover:text-slate-100 hover:bg-slate-800
                       transition-colors focus:outline-none focus:ring-2
                       focus:ring-sky-500 focus:ring-offset-1 focus:ring-offset-slate-900">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" class="w-4 h-4 pointer-events-none">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

</header>


<!-- ═══════════════════════════════════════════════════════════
     Main Layout
     mobile: single column
     md+:    video left │ controls right
     ═══════════════════════════════════════════════════════════ -->
<main class="flex flex-col md:flex-row gap-4 p-4 md:p-6 max-w-7xl mx-auto w-full">


    <!-- ── Video Column ──────────────────────────────────────── -->
    <section class="flex-1 min-w-0 flex flex-col gap-3">

        <!-- Feed -->
        <div class="video-container shadow-2xl">
            <img id="camera-feed"
                 src="{{ url_for('static', path='img/camera-placeholder.svg') }}"
                 alt="Live camera feed"
                 draggable="false">

            <div id="video-overlay" class="video-overlay">
                <div class="video-spinner"></div>
                <p class="text-slate-400 text-sm">Connecting to stream…</p>
            </div>
        </div>

        <!-- Info bar below video -->
        <div class="card flex items-center justify-between gap-4 py-2 px-4 text-xs text-slate-400">
            <div class="flex items-center gap-2 min-w-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 text-sky-400"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
                </svg>
                <span id="active-camera-name" class="font-mono truncate">{{ active_camera }}</span>
            </div>
            <span id="info-fps" class="font-mono tabular-nums shrink-0">-- FPS</span>
        </div>

    </section>


    <!-- ── Controls Column ───────────────────────────────────── -->
    <aside class="flex flex-row md:flex-col items-start md:items-stretch gap-4 md:w-44">

        <!-- PTZ Card -->
        <div class="card flex-1 md:flex-none flex flex-col items-center gap-4">
            <h2 class="self-start text-[0.65rem] text-slate-500 uppercase tracking-widest font-semibold">
                PTZ Controls
            </h2>

            <!-- Compass grid -->
            <div class="ptz-grid" id="ptz-controls">
                <!-- Row 1 -->
                <div></div>
                <button class="ptz-btn" data-ptz="up" aria-label="Move up" title="Up">
                    <!-- Arrow Up -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round"
                         class="w-5 h-5 pointer-events-none">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
                <div></div>

                <!-- Row 2 -->
                <button class="ptz-btn" data-ptz="left" aria-label="Move left" title="Left">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round"
                         class="w-5 h-5 pointer-events-none">
                        <path d="M19 12H5M12 5l-7 7 7 7"/>
                    </svg>
                </button>

                <button class="ptz-btn ptz-btn--stop" data-ptz="stop"
                        aria-label="Stop movement" title="Stop">
                    <!-- Stop / center dot -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="currentColor" class="w-4 h-4 pointer-events-none opacity-60">
                        <circle cx="12" cy="12" r="5"/>
                    </svg>
                </button>

                <button class="ptz-btn" data-ptz="right" aria-label="Move right" title="Right">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round"
                         class="w-5 h-5 pointer-events-none">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Row 3 -->
                <div></div>
                <button class="ptz-btn" data-ptz="down" aria-label="Move down" title="Down">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round"
                         class="w-5 h-5 pointer-events-none">
                        <path d="M12 5v14M5 12l7 7 7-7"/>
                    </svg>
                </button>
                <div></div>
            </div>

            <p class="text-[0.65rem] text-slate-600 text-center leading-tight">
                Hold to move · release to stop
            </p>
        </div>

        <!-- Status detail card (hidden on very small screens) -->
        <div class="card hidden sm:flex flex-col gap-2 text-xs text-slate-400 flex-1 md:flex-none">
            <h2 class="text-[0.65rem] text-slate-500 uppercase tracking-widest font-semibold">
                Status
            </h2>
            <dl class="space-y-1.5">
                <div class="flex justify-between gap-2">
                    <dt class="text-slate-500">Stream</dt>
                    <dd id="detail-status" class="font-mono text-slate-300">—</dd>
                </div>
                <div class="flex justify-between gap-2">
                    <dt class="text-slate-500">FPS</dt>
                    <dd id="detail-fps" class="font-mono tabular-nums text-slate-300">—</dd>
                </div>
            </dl>
        </div>

    </aside>

</main>

<!-- ═══════════════════════════════════════════════════════════
     Config Modal
     ConfigWidget renders all inner content dynamically.
     ═══════════════════════════════════════════════════════════ -->
<div id="config-modal" aria-hidden="true"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
    <div role="dialog" aria-modal="true" aria-labelledby="config-modal-title"
         class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl
                w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden">
        <!-- ConfigWidget renders header, body, and footer here -->
        <div id="config-modal-inner" class="flex flex-col flex-1 min-h-0"></div>
    </div>
</div>

{% endblock %}


{% block scripts %}
<script src="{{ url_for('static', path='js/stream.js') }}"></script>
<script src="{{ url_for('static', path='js/ptz.js') }}"></script>
<script src="{{ url_for('static', path='js/config.js') }}"></script>
<script>
    /** Escape a string for safe interpolation into innerHTML. */
    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    const INITIAL_CAMERA = "{{ active_camera }}";

    const stream = new VideoStream({
        img:        document.getElementById('camera-feed'),
        overlay:    document.getElementById('video-overlay'),
        fps:        document.getElementById('fps-display'),
        badge:      document.getElementById('status-badge'),
        cameraName: INITIAL_CAMERA,
    });

    const ptz = initPtz(document.getElementById('ptz-controls'), INITIAL_CAMERA);

    let activeCameraName = INITIAL_CAMERA;

    async function loadCameraSelector() {
        const res = await fetch('/api/cameras');
        if (!res.ok) return;
        const cameras = await res.json();
        const selector = document.getElementById('camera-selector');

        // Hide the selector when there is only one camera — no meaningful choice to make.
        selector.classList.toggle('hidden', cameras.length <= 1);

        selector.innerHTML = cameras.map((cam) => `
            <button type="button"
                    data-cam="${escHtml(cam.name)}"
                    class="cam-selector-btn text-xs px-3 py-1 rounded-lg border
                           border-slate-600 text-slate-300 hover:text-slate-100
                           hover:border-slate-500 transition-colors focus:outline-none
                           focus:ring-2 focus:ring-sky-500
                           ${cam.name === activeCameraName ? 'bg-sky-700 border-sky-600 text-white' : ''}">
                ${escHtml(cam.name)}
            </button>
        `).join('');

        selector.querySelectorAll('[data-cam]').forEach((btn) => {
            btn.addEventListener('click', () => selectCamera(btn.dataset.cam));
        });
    }

    function selectCamera(name) {
        activeCameraName = name;
        document.getElementById('active-camera-name').textContent = name;
        stream.switchCamera(name);
        ptz.setCameraName(name);
        // Re-render the selector to reflect the newly active camera.
        loadCameraSelector();
    }

    const configWidget = new ConfigWidget('config-modal', {
        onCamerasChanged: async () => {
            await loadCameraSelector();
        },
        onCameraUpdated: (oldName, newName) => {
            if (oldName !== activeCameraName) return;
            activeCameraName = newName;
            document.getElementById('active-camera-name').textContent = newName;
            stream.switchCamera(newName);
            ptz.setCameraName(newName);
        },
    });

    document.getElementById('config-btn').addEventListener('click', () => configWidget.open());

    // ── Sync FPS / status to secondary display elements ──────
    const detailFps    = document.getElementById('detail-fps');
    const detailStatus = document.getElementById('detail-status');
    const infoFps      = document.getElementById('info-fps');
    const labelEl      = document.querySelector('[data-label]');

    const observer = new MutationObserver(() => {
        const fps = document.getElementById('fps-display').textContent;
        if (detailFps)    detailFps.textContent   = fps;
        if (infoFps)      infoFps.textContent      = fps;
        if (detailStatus) detailStatus.textContent =
            document.querySelector('[data-label]')?.textContent ?? '—';
    });

    observer.observe(document.getElementById('fps-display'), { childList: true });
    if (labelEl) observer.observe(labelEl, { childList: true });

    loadCameraSelector();
    stream.connect();
</script>
{% endblock %}
